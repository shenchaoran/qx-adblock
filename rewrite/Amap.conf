# 高德地图：去广告重写（由 tools/build.py 生成，请勿手改）
# 作用的 App：高德地图
# 上游：https://raw.githubusercontent.com/ddgksf2013/Rewrite/dc3ea2c1fb2db870676b26da24006083eb1d44d3/AdBlock/AmapAds.conf
# 上游 sha256：d0c1caf909e3e9151ec890eb31bc14dc28b34c49d6c8a1ef42c147cd949564b3
# 收录规则 8 条；不在 App 白名单内删除 0 条，按策略删除 0 条，敏感域名删除 1 条，因脚本不安全删除 9 条
# 会被解密（MitM）的域名 → App，共 5 个：
#   m5.amap.com  →  高德地图
#   m5-zb.amap.com  →  高德地图
#   center.amap.com  →  高德地图
#   amap-aos-info-nogw.amap.com  →  高德地图
#   ai.amap.com  →  高德地图

hostname = m5.amap.com, m5-zb.amap.com, center.amap.com, amap-aos-info-nogw.amap.com, ai.amap.com

# > 高德地图：开屏请求
^https?:\/\/.*\.amap\.com\/ws\/aos\/alimama\/splash_screen url reject-200
# > 高德地图：首页底部信息流
^https?:\/\/.*\.amap\.com\/v\d\/ai_rec\/ url reject-dict
# > 高德地图：路线规划下方广告
^https?:\/\/.*\.amap\.com\/ws\/faas\/amap-navigation\/card-service-route-plan\? url reject-dict
# > 高德地图：Tip请求
^https?:\/\/.*\.amap\.com\/ws\/boss\/order_web\/\w{8}_information url reject-200
# > 高德地图：通用广告请求
^https?:\/\/.*\.amap\.com\/ws\/asa\/ads_attribution url reject
# > 高德地图：搜索框scene
^https?:\/\/.*\.amap\.com\/ws\/shield\/scene\/recommend url reject-dict
# > 高德地图：首页左上角gif
^https?:\/\/.*\.amap\.com\/uploadimg\/\w+\.gif url reject-img
# > 高德地图：左下天气
^https?:\/\/.*\.amap\.com\/ws\/valueadded\/weather url reject-dict
