# 哔哩哔哩：去广告重写（由 tools/build.py 生成，请勿手改）
# 作用的 App：哔哩哔哩
# 上游：https://ddgksf2013.top/rewrite/BiliBiliAdsLite.conf
# 上游 sha256：36fe0263f482d8df3a49c367eeedceaafb163022f394bed127f13dd319ec9bf9
# 收录规则 6 条；不在 App 白名单内删除 0 条，按策略删除 2 条，敏感域名删除 0 条，因脚本不安全删除 0 条
# 会被解密（MitM）的域名 → App，共 1 个：
#   app.bilibili.com  →  哔哩哔哩

hostname = app.bilibili.com

# > 哔哩哔哩：开屏广告
^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/show url reject-200
# > 哔哩哔哩：开屏广告列表
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/bilibili.ads.js
# > 哔哩哔哩：首页推荐流去广告
^https?:\/\/app\.bilibili\.com\/x\/v2\/feed\/index url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/bilibili.ads.js
# > 哔哩哔哩：顶栏 / 底栏标签精简
^https?:\/\/app\.bilibili\.com\/x\/resource\/show\/tab url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/bilibili.ads.js
# > 哔哩哔哩：顶部活动入口
^https?:\/\/app\.bilibili\.com\/x\/resource\/top\/activity url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/bilibili.ads.js
# > 哔哩哔哩：搜索页热搜与推广
^https?:\/\/app\.bilibili\.com\/x\/v2\/search\/square url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/bilibili.ads.js
