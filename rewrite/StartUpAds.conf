# 去开屏（滴滴/盒马/去哪儿/携程/神州/马蜂窝/两步路）：去广告重写（由 tools/build.py 生成，请勿手改）
# 作用的 App：滴滴、盒马、两步路、马蜂窝、去哪儿、神州租车、携程
# 上游：https://ddgksf2013.top/rewrite/StartUpAds.conf
# 上游 sha256：9a3443554fe38d94c1b65d648c89f408c87574c674d4a7f4550c758d5d75639b
# 收录规则 9 条；不在 App 白名单内删除 489 条，按策略删除 0 条，敏感域名删除 0 条，因脚本不安全删除 0 条
# 按 App 收录：滴滴 2 条、盒马 1 条、两步路 1 条、马蜂窝 1 条、去哪儿 2 条、神州租车 1 条、携程 1 条
# 会被解密（MitM）的域名 → App，共 8 个：
#   res.xiaojukeji.com  →  滴滴
#   acs-m.freshippo.com  →  盒马
#   homefront.qunar.com  →  去哪儿
#   client.qunar.com  →  去哪儿
#   ma-adx.ctrip.com  →  携程
#   apiproxy.zuche.com  →  神州租车
#   mapi.mafengwo.cn  →  马蜂窝
#   helper.2bulu.com  →  两步路

hostname = res.xiaojukeji.com, acs-m.freshippo.com, homefront.qunar.com, client.qunar.com, ma-adx.ctrip.com, apiproxy.zuche.com, mapi.mafengwo.cn, helper.2bulu.com

# > 滴滴：活动弹窗
https?://res\.xiaojukeji\.com\/resapi\/activity\/mget url reject-200
# > 滴滴：开屏广告预加载与通知
https?:\/\/res\.xiaojukeji\.com\/resapi\/activity\/get(Ruled|Preload|PasMultiNotices) url reject-200
# > 盒马：首页弹窗与开屏
^https?:\/\/acs-m\.freshippo\.com\/gw\/mtop\.wdk\.render\.querysinglepage url reject-200
# > 两步路：开屏、弹窗、推广任务
https?:\/\/helper\.2bulu\.com\/(greenPea\/queryTasks|proSpecial\/allData|saveSplashFrequencyStatistics|getPopInfo|getAppEntranceConfig|promote\/list|getSplash|outing\/reqFoundNewList|outing\/reqIndex) url reject-200
# > 马蜂窝：开屏广告
^https://mapi.mafengwo.cn\/ad\/get_launch_ad_list\/v2 url reject-200
# > 去哪儿：开屏广告
https://homefront.qunar.com/front/splash/ad url reject-200
# > 去哪儿：开屏广告
^https?:\/\/client\.qunar\.com\/pitcher-proxy\?qrt=p_splashAd url reject-200
# > 神州租车：营销投放位（返回空对象）
^https?:\/\/apiproxy\.zuche\.com\/resource\/cardes\/toufang\/marketing url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/dict.js
# > 携程：广告埋点
^https:\/\/ma-adx\.ctrip\.com\/_ma\.gif url reject-200
