# 小红书：去广告重写（由 tools/build.py 生成，请勿手改）
# 作用的 App：小红书
# 上游：https://ddgksf2013.top/rewrite/XiaoHongShuAds.conf
# 上游 sha256：46c96fb5b9b640d2b51a0b6562b91237116c523bdca8ff3b17318c30799ab19e
# 收录规则 15 条；不在 App 白名单内删除 0 条，按策略删除 10 条，敏感域名删除 0 条，因脚本不安全删除 0 条
# 会被解密（MitM）的域名 → App，共 1 个：
#   *.xiaohongshu.com  →  小红书

hostname = *.xiaohongshu.com

# > 小红书：搜索结果推荐信息
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/notes\/recommend_info\? url reject-200
# > 小红书：开屏广告
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/system_service\/splash url reject-200
# > 小红书：搜索结果去广告
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/notes\? url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/xiaohongshu.ads.js
# > 小红书：笔记详情页挂件（商品卡、活动卡）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/widgets url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/xiaohongshu.ads.js
# > 小红书：开屏广告预加载（把投放时间改到远期）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/system_service\/splash_config url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/xiaohongshu.ads.js
# > 小红书：首页信息流去广告
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/homefeed\? url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/xiaohongshu.ads.js
# > 小红书：启动配置（去掉商城入口、开屏图、加载图）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/system_service\/config\? url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/xiaohongshu.ads.js
# > 小红书：首页频道（去掉购物、直播等商业频道）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/homefeed\/categories url script-response-body https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@main/scripts/xiaohongshu.ads.js
# > 小红书：HTTPDNS 调度（让广告域名解析失败）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/gslb url reject-200
# > 小红书：HTTPDNS 调度（让广告域名解析失败）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/httpdns url reject-200
# > 小红书：广告接口
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/(tag\/)?ads url reject-200
# > 小红书：状态上报
^https?:\/\/[a-z]+\.xiaohongshu\.com\/v\d+\/stateReport url reject-200
# > 小红书：运营开关
^https?:\/\/[a-z]+\.xiaohongshu\.com\/data\/native\/matrix_switches url reject-200
# > 小红书：青少年模式状态上报
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/user\/teenager\/status url reject-200
# > 小红书：首页引导弹窗
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/guide\/home_guide url reject-200
