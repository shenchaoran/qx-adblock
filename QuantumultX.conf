# Quantumult X 去广告配置（精简、锁定版本）
# 仓库：https://github.com/shenchaoran/qx-adblock
# 构建：资源 @90fb2215d3f5eaf59909801d155dc3ffda825aca，重写 @8551871be5d58a3c0275098648f37ee7b56d0ba4
#
# 只做一件事：去广告。没有节点，没有任何流量走代理，未命中规则的流量全部直连。
# 所有远程资源都指向本仓库的某个固定 commit，作者以后改什么都影响不到这里。
#
# 使用前必读：
# 1. 运行模式选「规则分流」（全部直连模式下规则不生效）。
# 2. 证书在 QX 里自己生成；生成后 QX 会把 passphrase 和 p12 写到下面 [mitm] 里。
#    这两行属于私钥，不要提交到仓库，也不要发给任何人。
# 3. 设置 › VPN 里关闭「兼容性增强」，否则微博等 App 去广告会失效。

[general]
# 运营商一键登录等服务需要真实 DNS 结果，不能用占位 IP
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.10099.com.cn, *.pingan.com.cn
# 丢弃 QUIC（UDP 443），App 会回落到 TCP+TLS，重写才能生效
udp_drop_list = 443, QUIC
# SSDP 组播不进隧道
excluded_routes = 239.255.255.250/32

[dns]
no-ipv6
no-system
server = 223.5.5.5
server = 119.29.29.29

[policy]

[server_local]

[server_remote]

[filter_remote]
# 顺序有意义：误杀修正（direct）必须排在拦截规则前面
https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@90fb2215d3f5eaf59909801d155dc3ffda825aca/filter/RewriteAllow.list, tag=重写附带直连, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@90fb2215d3f5eaf59909801d155dc3ffda825aca/filter/Unbreak.list, tag=误杀修正, force-policy=direct, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@90fb2215d3f5eaf59909801d155dc3ffda825aca/filter/AdvertisingLite.list, tag=广告域名, force-policy=reject, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@90fb2215d3f5eaf59909801d155dc3ffda825aca/filter/RewriteBlock.list, tag=重写附带拦截, force-policy=reject, update-interval=604800, opt-parser=false, enabled=true

[filter_local]
final, direct

[rewrite_remote]
https://cdn.jsdelivr.net/gh/shenchaoran/qx-adblock@8551871be5d58a3c0275098648f37ee7b56d0ba4/rewrite/StartUpAds.conf, tag=去开屏（滴滴/盒马/去哪儿/携程/神州/马蜂窝/两步路）, update-interval=604800, opt-parser=false, enabled=true
